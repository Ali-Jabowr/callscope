[project]
name = "callscope"
version = "0.1.0"
description = "MVP: структурированный разбор клиентских звонков с контролем галлюцинаций"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["callscope"]


[dependency-groups]
dev = ["ruff", "mypy", "pytest", "hypothesis", "pip-audit"]

[tool.ruff.lint]
# Defaults + rules that catch typical AI-code mistakes.
extend-select = [
  "E", "F", "W", "I",   # pycodestyle, pyflakes, imports
  "B",                  # bugbear: likely bugs
  "BLE",                # no blind `except Exception`
  "E722",               # no bare `except:`
  "S",                  # bandit security rules
  "UP", "SIM", "RET", "PT",
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is fine in tests

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
