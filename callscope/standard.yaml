# Стандарт первого звонка по новой продаже. Критерии оценивает модель
# только для call_type == "новая_продажа"; цитаты проверяет код.
- id: needs_discovered
  title: Выявил потребность и боль клиента
  description: Менеджер задал вопросы о процессах, задачах и проблемах клиента и выяснил, зачем ему решение.
- id: decision_maker_identified
  title: Выяснил, кто принимает решение
  description: Менеджер узнал, кто принимает решение о покупке и кто ещё участвует в согласовании.
- id: presentation_tied_to_needs
  title: Презентовал под потребность, а не списком функций
  description: Возможности продукта подавались как ответ на названную клиентом задачу, а не перечнем функций.
- id: next_step_dated
  title: Договорился о конкретном шаге с датой
  description: Звонок завершился согласованным следующим действием с названным днём или сроком.
- id: exact_price
  title: Не называл цену «около», когда клиент ждёт расчёт
  description: Если клиент ждал расчёта, менеджер назвал точную цену или обещал расчёт, а не приблизительную сумму.
- id: objection_handled
  title: Отработал возражение
  description: На возражение клиента менеджер ответил по существу, с аргументом или уточняющим вопросом, а не проигнорировал его.
